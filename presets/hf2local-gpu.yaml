# hf2local-gpu: NVIDIA L40S (48 GB, Ada, native FP8) for hf2local validate-cuda --vllm
# T4/A10G have no FP8 tensor cores, so they cannot stand in for the 5090s.
# The BF16 --fidelity gate needs ~54 GB VRAM for a 27B: use --type g6e.12xlarge (4x L40S).
name: hf2local-gpu
description: "hf2local CUDA validation: L40S 48 GB, 64 GB RAM (use with userdata/hf2local.sh)"

instance_type: g6e.2xlarge
# Deep Learning Base OSS Nvidia Driver AMI (Ubuntu 22.04)
ami_pattern: "Deep Learning Base OSS Nvidia Driver GPU AMI (Ubuntu 22.04)*"
ami_owner: amazon
ami_id: ""

volume_size: 500
root_device: /dev/sda1
ssh_user: ubuntu
spot_friendly: true

cost_per_hour: 2.242

post_launch_hint: "Run: nvidia-smi. Bootstrap log: /var/log/hf2local-bootstrap.log. vLLM goes in its own env (HF2LOCAL_VLLM_PYTHON)"
